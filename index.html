<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140c2a; color: #fff; overscroll-behavior: none;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* 論理サイズ 390×780 の「舞台」。game.js が画面に合わせて拡大縮小する */
  #stage { position: fixed; left: 0; top: 0; width: 390px; height: 780px; transform-origin: 0 0; pointer-events: none; }
  .overlay { position: absolute; inset: 0; pointer-events: auto; text-align: center; }
  .overlay.hidden { display: none; }
  .abs { position: absolute; left: 0; right: 0; }
  h1 { margin: 0; font-weight: 900; line-height: 1.15; text-shadow: 0 3px 0 #1b1430, 0 0 12px rgba(0,0,0,.5); }
  h1 .l1 { display: block; font-size: 34px; color: #ffe066; letter-spacing: 1px; }
  h1 .l2 { display: block; font-size: 52px; color: #fff; }
  p { margin: 0; line-height: 1.6; }
  button { font: inherit; font-weight: 900; font-size: 22px; padding: 12px 28px; border: 4px solid #1b1430; border-radius: 999px;
    background: #ffe066; color: #1b1430; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 6px 0 #1b1430; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #1b1430; }
  button.big { width: 310px; height: 82px; font-size: 36px; background: #9be15d; }
  button.sub { font-size: 18px; padding: 8px 20px; background: #fff6e0; box-shadow: 0 4px 0 #1b1430; white-space: nowrap; }
  #pSound, #btnQuit { min-width: 128px; }
  .card { background: rgba(255, 250, 236, .95); color: #1b1430; border: 4px solid #1b1430; border-radius: 20px; margin: 0 18px; padding: 14px 12px; }
  .shadowtext { text-shadow: 0 2px 0 #1b1430, 0 0 8px rgba(0,0,0,.6); font-weight: 800; }
  #tDaily { word-break: keep-all; top: 500px; font-size: 16px; padding: 0 10px; line-height: 1.5; white-space: pre-line; }
  #tBest { top: 562px; font-size: 18px; color: #ffe066; }
  #hNum { top: 18px; font-size: 18px; }
  #sa { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; }
  .ptable { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; text-align: left; font-size: 16px; font-weight: 800; color: #1b1430; }
  .ptable .chip { display: inline-block; width: 22px; height: 16px; border-radius: 5px; border: 2px solid #1b1430; vertical-align: -2px; margin-right: 5px; }
  .ptable .pt { text-align: right; font-weight: 900; }
  .ptable .how { font-size: 16px; color: #4a3a5a; }
  #hCard.tall { top: 64px !important; }
  #hTable { margin-top: 6px; }
  #rWin { top: 380px; font-size: 20px; color: #9be15d; font-weight: 900; }
  #rNext { display: none; top: 470px; font-size: 16px; color: #ffe8a0; padding: 0 12px; }
  #rToast { top: 650px; font-size: 16px; color: #9be15d; }
  #result button.big[disabled], #result button.sub[disabled] { opacity: .35; }
  #pauseCard .ptable { margin: 4px 6px 4px; }
  #hText1 { font-size: 22px; font-weight: 800; }
  #hText2 { font-size: 40px; font-weight: 900; color: #e02020; line-height: 1.3; }
  #hText3 { font-size: 16px; margin-top: 6px; white-space: pre-line; word-break: keep-all; }
  #pauseCard { top: 22px; padding: 14px 10px; }
  #pauseCard h2 { margin: 0 0 6px; font-size: 28px; }
  #pauseCard button { display: block; margin: 10px auto 0; }
  #pauseCard p.small { font-size: 16px; font-weight: 800; margin: 2px 0; }
  #rLine { top: 166px; font-size: 17px; padding: 0 14px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }
  #rDanBox { top: 214px; font-size: 26px; font-weight: 900; }
  #rDan { font-size: 76px; color: #ffe066; line-height: 1; }
  #rScore { top: 300px; font-size: 32px; font-weight: 900; }
  #rBest { top: 344px; font-size: 18px; }
  #rBest.best { color: #ffe066; font-size: 24px; font-weight: 900; }
  #rStats { top: 414px; font-size: 16px; }
  #rTitle { top: 442px; font-size: 18px; color: #ffd0f0; padding: 0 12px; }
  #rFaces { top: 494px; font-size: 16px; }
</style>

<body>
<canvas id="game"></canvas>
<div id="sa"></div>
<div id="stage">
  <div id="title" class="overlay hidden">
    <div class="abs" style="top:46px"><h1><span class="l1">こっち見ないで!</span><span class="l2">だるま落とし</span></h1></div>
    <p id="tDaily" class="abs shadowtext"></p>
    <p id="tBest" class="abs shadowtext"></p>
    <div class="abs" style="top:600px"><button id="btnPlay" class="big" type="button">あそぶ</button></div>
    <div class="abs" style="top:712px"><button id="btnHow" class="sub" type="button">あそびかた</button> <button id="tSound" class="sub" type="button">音:オン</button></div>
  </div>
  <div id="howto" class="overlay hidden">
    <p id="hNum" class="abs shadowtext"></p>
    <div id="hCard" class="abs card" style="top:404px"><p id="hText1"></p><p id="hText2"></p><p id="hText3"></p><div id="hTable" class="ptable"></div></div>
    <div class="abs" style="top:620px"><button id="btnNext" class="big" type="button">つぎへ</button></div>
    <div class="abs" style="top:714px"><button id="btnSkip" class="sub" type="button">とばす</button></div>
  </div>
  <div id="pause" class="overlay hidden" style="background:rgba(10,6,24,.6)">
    <div id="pauseCard" class="abs card">
      <h2>ひとやすみ</h2>
      <p class="small">段の点数(色で ちがう)</p>
      <div id="pTable" class="ptable"></div>
      <button id="btnResume" class="big" type="button">つづける</button>
      <div style="display:flex;justify-content:center;gap:28px;margin-top:4px"><button id="pSound" class="sub" type="button">音:オン</button><button id="btnQuit" class="sub" type="button">やめる</button></div>
    </div>
  </div>
  <div id="result" class="overlay hidden">
    <p id="rLine" class="abs shadowtext"></p>
    <div id="rDanBox" class="abs shadowtext"><span id="rDan">0</span> 段 おとした</div>
    <p id="rScore" class="abs shadowtext"></p>
    <p id="rBest" class="abs shadowtext"></p>
    <p id="rStats" class="abs shadowtext"></p>
    <p id="rWin" class="abs shadowtext"></p>
    <p id="rTitle" class="abs shadowtext"></p>
    <p id="rNext" class="abs shadowtext"></p>
    <p id="rFaces" class="abs shadowtext"></p>
    <div class="abs" style="top:556px"><button id="btnAgain" class="big" type="button">もういっかい</button></div>
    <p id="rToast" class="abs shadowtext"></p>
    <div class="abs" style="top:682px;display:flex;justify-content:center;gap:16px"><button id="btnShare" class="sub" type="button">送る・シェア</button><button id="btnToTitle" class="sub" type="button">タイトルへ</button></div>
  </div>
</div>
<script src="js/audio.js"></script>
<script src="js/daruma-art.js"></script>
<script src="js/rules.js"></script>
<script src="js/game.js"></script>
<script>
'use strict';
// LINE の中で開いたときだけ、1回だけ案内する(LINE の中は画面が小さく、ホーム画面にも入れられない)
(function () {
  var seenKey = 'daruma-line-tip', seen = false;
  try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (!/\bLine\//i.test(navigator.userAgent) || standalone || seen) return;
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:99999;background:#fffaf0;color:#1b1430;border:3px solid #1b1430;border-radius:14px;padding:10px 40px 10px 12px;font:700 13px/1.5 system-ui,sans-serif';
  bar.textContent = 'LINEの中だと画面が小さめです。右下の「…」(または右上の︙)から「ブラウザで開く」を選ぶと、大きく遊べて、ホーム画面にも入れられます。';
  var x = document.createElement('button'); x.type = 'button'; x.setAttribute('aria-label', 'とじる'); x.textContent = '×';
  x.style.cssText = 'position:absolute;top:4px;right:6px;width:32px;height:32px;border:0;background:none;font:900 20px/1 system-ui;color:#1b1430;cursor:pointer';
  x.addEventListener('click', function () { try { localStorage.setItem(seenKey, '1'); } catch (e) {} bar.remove(); });
  bar.appendChild(x); addEventListener('load', function () { document.body.appendChild(bar); });
})();

// ホーム画面に入れられる(アプリのように開く)ための登録。file:// や 登録できない所では 何もしない
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>

</script>
